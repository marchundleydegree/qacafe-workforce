name: QA Café Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 

jobs:

  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: flake8 . --count --show-source --statistics

  test:
    runs-on: ubuntu-latest
    needs: [analyse, lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask application
        run: |
          python -m flask --app app run \
            --host 127.0.0.1 \
            --port 5000 > flask.log 2>&1 &

      - name: Check Flask availability
        run: |
          for i in {1..20}; do
            if curl --fail --silent \
              http://127.0.0.1:5000/ > /dev/null; then
              echo "Flask application is ready"
              exit 0
            fi
            sleep 1
          done

          echo "Flask application failed to start"
          cat flask.log
          exit 1

      - name: Run Pytest and Playwright tests
        run: python -m pytest -v

      - name: Display Flask logs on failure
        if: failure()
        run: |
          if [ -f flask.log ]; then
            cat flask.log
          fi

  package:
    runs-on: ubuntu-latest
    needs: [analyse, lint, test]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Distribution Directory
        run: mkdir -p dist

      - name: Zip application
        run: |
          zip -r dist/app.zip \
            app.py \
            database.py \
            requirements.txt \
            templates/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/app.zip